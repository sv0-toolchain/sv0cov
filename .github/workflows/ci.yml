# SPDX-FileCopyrightText: 2026 Sasank Vishnubhatla
#
# CV-006: 4 hosts x CPython 3.13/3.14. Checks the dependency/packaging policy,
# schema preflight and generated-validator currency (CV-010, CV-011), and runs
# the test suite (with the jsonschema oracle) from the locked environment.
# Builds the sdist (then the wheel from it) twice and requires byte-identical,
# allowlisted artifacts.
#
# Third-party actions are pinned by full commit SHA (SPEC 25.4.3). Network
# access is used only to populate the locked environment. On Linux the
# security suite (CV-237) also runs inside an empty network namespace.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.host }} / py${{ matrix.python }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
        host: [linux-x86_64, linux-arm64, macos-x86_64, macos-arm64]
        include:
          - { host: linux-x86_64, runner: ubuntu-24.04, machine: x86_64 }
          - { host: linux-arm64, runner: ubuntu-24.04-arm, machine: aarch64 }
          - { host: macos-x86_64, runner: macos-15-intel, machine: x86_64 }
          - { host: macos-arm64, runner: macos-15, machine: arm64 }
    env:
      UV_NO_CONFIG: "1"
      UV_PYTHON_DOWNLOADS: never
      PYTHONDONTWRITEBYTECODE: "1"
      # CV-210: the native runtime's ThreadSanitizer and AddressSanitizer +
      # UBSan runs must happen on every host class, not skip.
      SV0COV_REQUIRE_SANITIZERS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: py
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.1"
          enable-cache: false

      - name: Host and interpreter identity
        shell: bash
        run: |
          python - <<'EOF'
          import platform, sys
          want = "${{ matrix.machine }}"
          got = platform.machine()
          print(sys.implementation.name, platform.python_version(), platform.system(), got)
          assert sys.implementation.name == "cpython"
          assert f"{sys.version_info.major}.{sys.version_info.minor}" == "${{ matrix.python }}"
          assert got == want, (got, want)
          assert sys.maxsize > 2**32
          EOF

      - name: Packaging and dependency-source policy
        run: python tools/check_packaging.py policy

      - name: Production import boundary (stdlib + sv0cov only)
        run: |
          python tools/import_audit.py
          python tools/import_audit.py --no-site

      - name: Stdlib-only test run (no third-party packages)
        run: python -m unittest discover -s tests

      - name: Security suite in an empty network namespace (Linux; CV-237, COV-SEC-001)
        if: startsWith(matrix.host, 'linux')
        run: >-
          sudo unshare --net --
          setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups --
          env PATH="$PATH" HOME="$HOME" SV0COV_REQUIRE_NETWORK_DENIAL=1
          "${{ steps.py.outputs.python-path }}" -m unittest -v tests.test_security

      - name: Locked test environment
        run: >-
          uv sync --locked --no-default-groups --group test --group oracle
          --python "${{ steps.py.outputs.python-path }}"

      - name: Lock is current (offline)
        run: uv lock --check --offline

      - name: Schema preflight (closed Draft 2020-12 profile + offline meta-schema)
        run: uv run --locked --offline --no-sync python tools/schemagen/preflight.py --require-metaschema

      - name: Generated validators are current
        run: uv run --locked --offline --no-sync python tools/schemagen/generate.py --check

      - name: Tests (pytest, locked, offline)
        run: uv run --locked --offline --no-sync python -m pytest -p no:cacheprovider tests

      - name: Reproducible sdist -> wheel build
        run: python tools/check_packaging.py build "$RUNNER_TEMP/dist"

      # CV-243 (SPEC 25.2.7, 25.4; R0-G8): the release pipeline, dry run only.
      # Build once from the commit (twice for byte identity), inspect, install,
      # produce every attachment, SHA256SUMS and the release manifest, verify;
      # nothing is tagged, attested or published.
      - name: Release dry run
        run: python tools/release.py dry-run "$RUNNER_TEMP/release"

      - name: Release dry-run checks (verify refuses every tampered copy)
        env:
          SV0COV_RELEASE_DRY_RUN: ${{ runner.temp }}/release
        run: python -m unittest -v tests.test_release_pipeline

      - name: Keep this cell's SHA256SUMS for the cross-cell comparison
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sums-${{ matrix.host }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/release/SHA256SUMS
          if-no-files-found: error

  # CV-243 (SPEC 25.2.7): every attachment is byte-identical across CPython
  # 3.13 and 3.14 and the four required hosts.
  release-agreement:
    name: release dry run identical on all eight cells
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: release-sums-*
          path: sums

      - name: Compare
        run: |
          set -eu
          ls sums
          test "$(ls sums | wc -l)" -eq 8
          first=$(ls sums | head -1)
          for cell in sums/*; do
            if ! cmp -s "sums/$first/SHA256SUMS" "$cell/SHA256SUMS"; then
              echo "::error::$(basename "$cell") differs from $first"
              diff "sums/$first/SHA256SUMS" "$cell/SHA256SUMS" || true
              exit 1
            fi
          done
          cat "sums/$first/SHA256SUMS"

  # CV-236 (SPEC 28.4): every push fuzzes each harness of tools/fuzz.py with a
  # fresh seed. A finding fails the job and its minimized input is uploaded;
  # checked into tests/fixtures/fuzz/<harness>/ it becomes a regression
  # fixture the test suite replays. Standard library only.
  # CV-418 (SPEC 21.4, COV-REP-009, AC-050): every LCOV golden through the
  # exact checksum-pinned LCOV 1.16 and 2.5 releases, `lcov --summary` and
  # `genhtml` with branch coverage, no ignored error, totals equal to the
  # tracefile's. The two tarballs are fetched first and refused unless their
  # pinned digests match (tests/conformance/lcov-distributions.json); the
  # check itself runs with no network. Both run on the host perl, with LCOV
  # 2.5's Perl modules from the runner's distribution.
  lcov-consumers:
    name: LCOV 1.16 + 2.5 consumers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # LCOV 2.5's non-core Perl modules (lcovutil.pm, genhtml); 1.16 needs none.
      - name: Perl modules for LCOV 2.5
        run: >-
          sudo apt-get install --no-install-recommends -y
          libcapture-tiny-perl libdatetime-perl libdatetime-format-w3cdtf-perl libdevel-stacktrace-perl
          libtimedate-perl libjson-xs-perl

      - name: Fetch the pinned LCOV releases
        run: |
          mkdir -p "$RUNNER_TEMP/lcov"
          python tools/lcov_conformance.py --fetch-into "$RUNNER_TEMP/lcov" | bash -euo pipefail

      - id: py
        name: Interpreter path
        run: echo "python-path=$(command -v python)" >> "$GITHUB_OUTPUT"

      - name: Conformance in an empty network namespace
        run: >-
          sudo unshare --net --
          setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups --
          env PATH="$PATH" HOME="$HOME"
          "${{ steps.py.outputs.python-path }}" tools/lcov_conformance.py
          --tarball 1.16="$RUNNER_TEMP/lcov/lcov-1.16.tar.gz" --tarball 2.5="$RUNNER_TEMP/lcov/lcov-2.5.tar.gz"

  # CV-408 (SPEC 21.2, R1-G8, COV-REP-007): WCAG 2.2 AA on the representative
  # HTML report set with the lockfile-pinned axe-core and Playwright Chromium
  # (tools/accessibility, the non-runtime 'accessibility' group), plus the
  # keyboard walk; tests/test_accessibility.py covers what needs no browser.
  accessibility:
    name: HTML WCAG 2.2 AA (axe-core + keyboard)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install the pinned checker (lockfile only) and Chromium
        working-directory: tools/accessibility
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Render the representative reports
        run: python tools/accessibility/build_reports.py "$RUNNER_TEMP/a11y"

      - name: axe-core WCAG 2.2 AA and keyboard checks
        working-directory: tools/accessibility
        run: node axe_check.mjs "$RUNNER_TEMP/a11y"

  fuzz:
    name: fuzz (linux-x86_64 / py3.14)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Replay the regression corpus
        run: python tools/fuzz.py replay

      - name: Fuzz every harness (60 s each, seed from this run)
        run: python tools/fuzz.py run --seconds 60 --seed "${{ github.run_id }}${{ github.run_attempt }}" --crash-dir "$RUNNER_TEMP/fuzz-findings"

      - name: Upload minimized findings
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-findings
          path: ${{ runner.temp }}/fuzz-findings
          if-no-files-found: ignore
